<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schnoos News</title>
    <link rel="stylesheet" href="./assets/styles/newspaper.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="edition">Weekly Family Edition</p>
      <h1>SCHNOOS NEWS</h1>
      <p class="tagline">Ink-soaked family stories, set like a Sunday paper.</p>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <h2>Weekly Family Form Intake</h2>
        <form id="submission-form">
          <label>
            Parent / Contributor
            <input type="text" id="contributor" name="contributor" required />
          </label>

          <label>
            Child Name(s)
            <input type="text" id="child-names" name="childNames" required />
          </label>

          <label>
            Weekly Story Notes
            <textarea id="notes" name="notes" rows="5" required></textarea>
          </label>

          <label>
            Publish On
            <input type="date" id="publish-date" name="publishDate" required />
          </label>

          <button type="submit">Queue Story</button>
        </form>
      </section>

      <section class="panel queue-panel">
        <h2>CMS Queue</h2>
        <ul id="queue-list"></ul>
        <button id="start-publishing" class="start">Start Press Run</button>
      </section>

      <section class="panel article-panel">
        <h2>Published Front Page</h2>
        <div id="published-articles" class="columns"></div>
      </section>

      <section class="panel template-panel span-all">
        <h2>Email Templates</h2>
        <label>
          Template Type
          <select id="email-template-select"></select>
        </label>
        <textarea id="email-template-body" rows="18" readonly></textarea>
        <div class="template-actions">
          <button type="button" id="copy-template">Copy Template</button>
          <a id="email-template-link" class="button-link" href="#" target="_blank" rel="noopener noreferrer">Open Email Draft</a>
        </div>
      </section>

      <section class="panel month-panel span-all">
        <h2>Coming Up This Month</h2>
        <label>
          Birthdays, holidays, and big family moments
          <textarea id="coming-up-text" rows="7" placeholder="Add upcoming birthdays, holidays, trips, school events, or other family highlights for this month."></textarea>
        </label>
        <button type="button" id="save-coming-up">Save This Month</button>
      </section>
    </main>

    <template id="article-template">
      <article class="paper-article">
        <h3></h3>
        <p class="byline"></p>
        <p class="body"></p>
      </article>
    </template>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
